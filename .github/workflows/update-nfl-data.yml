name: Update NFL data

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * 9-12 *'
    - cron: '17 */3 * 1-2 *'
  push:
    paths:
      - 'scripts/update_nfl_data.py'
      - '.github/workflows/update-nfl-data.yml'

# Evita que dos ejecuciones de este workflow se pisen entre sí.
concurrency:
  group: update-nfl-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate and publish NFL data safely
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Si alguien actualiza main mientras se generan los datos, no hacemos
          # rebase del JSON. Volvemos a la versión remota y regeneramos.
          for attempt in 1 2 3; do
            echo "Intento ${attempt}/3: sincronizando con origin/main"
            git fetch origin main
            git reset --hard origin/main

            python scripts/update_nfl_data.py

            git add -A -- data/nfl.json data/pbp_team_summaries

            if git diff --cached --quiet; then
              echo "No hay cambios en los datos."
              exit 0
            fi

            git commit -m "Update NFL team stats"

            if git push origin HEAD:main; then
              echo "Datos actualizados correctamente."
              exit 0
            fi

            echo "main cambió durante el proceso; se volverá a sincronizar y generar."
          done

          echo "No se pudo publicar después de 3 intentos."
          exit 1
